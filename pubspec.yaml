name: pet_health
description: "离线优先的狗狗健康履历、提醒与兽医协作工具。"
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.2

dependencies:
  characters: ^1.4.1
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  emoji_picker_flutter: ^4.4.0
  file_selector: ^1.0.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  flutter_riverpod: ^3.3.2
  flutter_timezone: ^5.1.0
  go_router: ^17.3.0
  image_cropper: ^8.1.0
  image_picker: ^1.2.2
  intl: ^0.20.2
  path_provider: ^2.1.6
  timezone: ^0.11.0
  uuid: ^4.5.3
  video_player: ^2.13.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    # 中文标题：ZCOOL KuaiLe（OFL），完整打包。
    - family: ZCOOLKuaiLe
      fonts:
        - asset: assets/fonts/zcool_kuaile/ZCOOLKuaiLe-Regular.ttf
    # 英文标题与数字：Fredoka 可变字重（OFL），用 FontVariation 指定字重。
    - family: Fredoka
      fonts:
        - asset: assets/fonts/fredoka/Fredoka-Variable.ttf
    # 中文正文：悠哉字体的精简版（OFL），见 assets/fonts/paw_hand/README.md。
    - family: PawHand
      fonts:
        - asset: assets/fonts/paw_hand/PawHand-Regular.ttf
        - asset: assets/fonts/paw_hand/PawHand-Medium.ttf
          weight: 500
